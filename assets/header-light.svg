<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 264" role="img" aria-labelledby="t">
<title id="t">Luiz Benevenuto, backend engineer in EV charging</title>
<style>
@font-face{font-family:B6;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:B4;src:url(data:font/woff2;base64,) format("woff2")}
.name{font:600 64px B6,sans-serif;fill:#1F2328;letter-spacing:.5px}
.cap{font:400 26px B4,sans-serif;fill:#59636E}
.unit{font:400 14px B4,sans-serif;fill:#59636E}
.axis{stroke:#59636E;stroke-width:1;opacity:.5}
.charge{fill:none;stroke:#A85F00;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;
stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.3,.7,.3,1) .3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.charge{animation:none;stroke-dashoffset:0}}
</style>
<text class="name" x="38" y="70">Luiz Benevenuto</text>
<text class="cap" x="40" y="110">Backend engineer. EV charging.</text>
<text class="unit" x="40" y="164">kW</text>
<path class="axis" d="M40 248 H880"/>
<path class="charge" pathLength="1" d="M40 248 C62 248 70 176 102 174 L210 172 C320 172 400 176 470 180 C560 186 600 232 700 240 C770 245 830 246 880 246"/>
</svg>
